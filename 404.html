<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nada aquí todavía</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .ambient-glow {
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.06) 45%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            user-select: none;
        }
        .code {
            font-size: clamp(6.5rem, 18vw, 11rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.06em;
            background: linear-gradient(180deg, #ffffff 25%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
            margin-bottom: 0.75rem;
        }
        .title {
            font-size: clamp(1.25rem, 3.5vw, 1.75rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <div class="code">404</div>
        <div class="title">Nada aquí todavía</div>
    </div>
</body>
</html>
